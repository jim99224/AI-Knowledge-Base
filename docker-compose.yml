services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-ai_knowledge_base}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok" | grep 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  knowledge-base:
    build:
      context: .
      target: development
    init: true
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ai_knowledge_base}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding-model:8000}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-/v1/embeddings}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-text-embedding-model}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      GENERAL_LLM_BASE_URL: ${GENERAL_LLM_BASE_URL:-http://general-llm:8000}
      GENERAL_LLM_ENDPOINT: ${GENERAL_LLM_ENDPOINT:-/v1/chat/completions}
      GENERAL_LLM_MODEL_ID: ${GENERAL_LLM_MODEL_ID:-general-llm}
      GENERAL_LLM_API_KEY: ${GENERAL_LLM_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "-m", "pytest"]

volumes:
  mongodb_data:

